<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https:; frame-src http: https:; object-src 'none'; base-uri 'self'">
<title>Velocita</title>
<style>
:root{
  --strip:linear-gradient(90deg,#cfe0f7,#d9e9fb 60%,#d2e8f6);
  --tab:rgba(255,255,255,.35);--tab-hover:rgba(255,255,255,.6);
  --surface:#fff;--bar:#fff;--field:#eceff8;--field-focus:#fff;
  --text:#1c2433;--muted:#667085;--line:#e4e9f2;--accent:#2f6fe4;--accent-soft:#e3edff;
  --danger:#d83a3a;--shadow:0 8px 28px rgba(35,70,130,.16);
  --home:linear-gradient(180deg,#cfe0f8 0%,#c8f2ea 28%,#eef3f1 62%,#f3f3f1 100%);
  --circle:#fff;
}
body.dark{
  --strip:linear-gradient(90deg,#171d2b,#1b2433 60%,#18222e);
  --tab:rgba(255,255,255,.06);--tab-hover:rgba(255,255,255,.12);
  --surface:#232b3b;--bar:#232b3b;--field:#171d2b;--field-focus:#1c2433;
  --text:#e8ecf5;--muted:#98a2b8;--line:#2f3a50;--accent:#6c9cff;--accent-soft:#2a3a5e;
  --danger:#ff7676;--shadow:0 8px 28px rgba(0,0,0,.45);
  --home:linear-gradient(180deg,#18243d 0%,#173a42 30%,#1a2230 65%,#161b26 100%);
  --circle:#2a3347;
}
body.gray{
  --strip:linear-gradient(90deg,#292b30,#303238 60%,#292b30);
  --tab:rgba(255,255,255,.06);--tab-hover:rgba(255,255,255,.12);
  --surface:#27292e;--bar:#27292e;--field:#1d1f23;--field-focus:#222429;
  --text:#eceef2;--muted:#a0a4ad;--line:#3a3d44;--accent:#aeb5c2;--accent-soft:#3a3e47;
  --danger:#ff8585;--shadow:0 8px 28px rgba(0,0,0,.42);
  --home:linear-gradient(180deg,#303238 0%,#292b30 42%,#222429 100%);
  --circle:#35383f;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:'Segoe UI Variable','Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);background:var(--surface);display:flex;flex-direction:column;overflow:hidden;font-size:14px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ---------- Sekme şeridi ---------- */
.strip{height:40px;background:var(--strip);display:flex;align-items:flex-end;gap:4px;padding:6px 150px 0 8px;-webkit-app-region:drag;user-select:none;flex-shrink:0}
body.mac .strip{padding-left:84px;padding-right:12px}
.strip>*{-webkit-app-region:no-drag}
.tabs{display:flex;align-items:flex-end;gap:2px;min-width:0;flex:1 1 0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:34px;min-width:200px;width:200px;flex:0 0 200px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;border-radius:10px 10px 0 0;background:var(--tab);cursor:default;font-size:12.5px;position:relative;transition:background .15s}
.tab:hover{background:var(--tab-hover)}
.tab.active{background:var(--bar);font-weight:600}
.tab .ico{width:16px;height:16px;flex-shrink:0;border-radius:3px;object-fit:contain;display:grid;place-items:center;font-size:13px}
.tab .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.pinned{min-width:44px;width:44px;flex:0 0 44px;padding:0 12px}
.tab.pinned .ttl,.tab.pinned .x{display:none}
.tab[data-group="work"]{box-shadow:inset 0 3px #3182ce}
.tab[data-group="personal"]{box-shadow:inset 0 3px #38a169}
.tab[data-group="research"]{box-shadow:inset 0 3px #dd6b20}
.tab[data-group="other"]{box-shadow:inset 0 3px #805ad5}
.tab .x{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:15px;flex-shrink:0}
.tab .x:hover{background:rgba(120,130,150,.25);color:var(--text)}
.tab.loading .ico{border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;font-size:0;width:14px;height:14px;margin:1px}
@keyframes spin{to{transform:rotate(360deg)}}
.plus{width:30px;height:30px;margin-bottom:2px;border-radius:8px;font-size:19px;color:var(--muted)}
.plus:hover{background:var(--tab-hover);color:var(--text)}
.tab-find-button{width:30px;height:30px;margin-bottom:2px;border-radius:8px;color:var(--muted);display:grid;place-items:center;flex-shrink:0}
.tab-find-button:hover{background:var(--tab-hover);color:var(--text)}
.tab-find-button svg.i{width:17px;height:17px}
.tab-finder{position:fixed;top:46px;right:150px;width:min(360px,calc(100vw - 24px));padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:90;display:none}
.tab-finder.show{display:block;animation:pop .15s var(--ease)}
.tab-finder input{width:100%;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);outline:none}
.tab-finder input:focus{border-color:var(--accent)}
.tab-finder-results{display:grid;gap:3px;max-height:min(420px,65vh);overflow:auto;margin-top:8px}
.tab-finder-row{display:flex;align-items:center;gap:10px;min-width:0;padding:8px;border-radius:10px;text-align:left}
.tab-finder-row:hover{background:var(--accent-soft)}
.tab-finder-row .result-icon{width:24px;height:24px;flex-shrink:0}
.tab-finder-row span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-finder-empty{padding:14px 8px;color:var(--muted);text-align:center}

/* ---------- Gezinme çubuğu ---------- */
.nav{height:46px;background:var(--bar);display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid var(--line);flex-shrink:0;position:relative;z-index:30}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:var(--muted);transition:background .15s,color .15s;flex-shrink:0}
.ib:hover:not(:disabled){background:var(--field);color:var(--text)}
.ib:disabled{opacity:.35;cursor:default}
.ib.on{color:#f5b301}
.private-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:12px;background:#34303f;color:#f5efff;font-size:12px;white-space:nowrap}
.private-badge[hidden]{display:none}
.addr-wrap{flex:1;position:relative;margin:0 6px}
.addr{width:100%;height:34px;border-radius:17px;border:2px solid transparent;background:var(--field);padding:0 44px 0 38px;outline:none;transition:.15s}
.addr:focus{background:var(--field-focus);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.addr-lock{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.addr-star{position:absolute;right:4px;top:2px;width:30px;height:30px}
.suggest{position:absolute;top:40px;left:0;right:0;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);padding:6px;display:none;overflow:hidden}
.suggest.show{display:block}
.sg{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:9px;cursor:pointer}
.sg:hover,.sg.sel{background:var(--accent-soft)}
.sg small{color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:13px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}

/* ---------- Menü / bul / bildirim ---------- */
.menu{position:absolute;right:10px;top:46px;width:270px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:6px;display:none;z-index:50}
.menu.show{display:block}
.tab-menu{position:fixed;min-width:190px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:5px;display:none;z-index:80}
.tab-menu.show{display:block}
.tab-menu button{display:block;width:100%;padding:8px 10px;border-radius:7px;text-align:left;white-space:nowrap}
.tab-menu button:hover{background:var(--accent-soft)}
.tab-menu .msep{margin:4px 2px}
.mi{display:flex;width:100%;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;text-align:left}
.mi:hover{background:var(--accent-soft)}
.mi em{margin-left:auto;font-style:normal;color:var(--muted);font-size:12px}
.mi span:first-child{width:20px;text-align:center}
.msep{height:1px;background:var(--line);margin:5px 6px}
.zoomrow{display:flex;align-items:center;gap:6px;padding:4px 12px}
.zoomrow b{flex:1;font-weight:500}
.zoomrow button{width:30px;height:28px;border-radius:7px}
.zoomrow button:hover{background:var(--accent-soft)}
.find{position:absolute;right:16px;top:100px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:6px 8px;display:none;align-items:center;gap:4px;z-index:40}
.find.show{display:flex}
.find input{border:none;outline:none;background:var(--field);border-radius:8px;height:30px;padding:0 10px;width:190px}
.find small{color:var(--muted);min-width:44px;text-align:center}
.download-list{display:grid;gap:10px}
.download-row{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:8px}
.download-head,.download-actions{display:flex;align-items:center;gap:10px;min-width:0}
.download-head .t{flex:1;min-width:0}
.download-head b,.download-head small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.download-head small{color:var(--muted);margin-top:3px}
.download-state{color:var(--muted);font-size:12px;white-space:nowrap}
.download-progress{width:100%;height:7px;border-radius:5px;overflow:hidden;background:var(--field)}
.download-progress span{display:block;height:100%;background:var(--accent);transition:width .15s}
.download-actions{justify-content:flex-end;flex-wrap:wrap}
.download-actions button{height:30px;padding:0 10px;border-radius:7px;background:var(--field);font-size:12px}
.download-actions button:hover{background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1f2937;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- İçerik ---------- */
.views{flex:1;position:relative;background:var(--surface)}
.bookmarks-bar{height:36px;display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--bar);border-bottom:1px solid var(--line);flex-shrink:0;overflow:hidden}
.bookmarks-bar[hidden]{display:none}
.bookmark-items{display:flex;align-items:center;gap:4px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}
.bookmark-items::-webkit-scrollbar{display:none}
.bookmark-item{height:28px;max-width:180px;display:flex;align-items:center;gap:7px;padding:0 9px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.bookmark-item:hover,.bookmark-more:hover{background:var(--field)}
.bookmark-item img{width:16px;height:16px;flex-shrink:0}
.bookmark-empty{padding:0 7px;color:var(--muted);font-size:12px;white-space:nowrap}
.bookmark-more{height:28px;padding:0 9px;border-radius:7px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.view{position:absolute;inset:0;display:none}
.view.active{display:block}
webview{position:absolute;inset:0;width:100%;height:100%}
.page{position:absolute;inset:0;overflow:auto}

/* Yeni sekme sayfası (referans görsele göre) */
.home{background:var(--home);display:flex;flex-direction:column;align-items:center;min-height:100%;padding:28px 40px 24px;position:relative}
.private-home{justify-content:center;gap:26px;background:#080a0e;color:#f5f6fa;text-align:center;padding:56px 24px 104px}
.private-mark{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#171b24;color:#c5d2f3;font-size:28px}
.private-home h1{font-size:28px;font-weight:600}
.private-home p{max-width:560px;color:#aab1c0;line-height:1.6}
.private-home .hsearch{margin-top:0;background:#1a1e27;box-shadow:none}
.private-home .hsearch input{color:#f5f6fa}
.private-home .hsearch button{background:#405b9c}
.private-logo{position:absolute;bottom:30px;display:flex;align-items:center;gap:10px;color:#d9dfeb;font-size:16px;font-weight:600}
.private-logo svg{width:38px;height:30px}
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.catalog-item{display:grid;align-content:start;gap:12px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.catalog-item h2{font-size:16px;font-weight:600}
.catalog-item p,.profile-note{color:var(--muted);line-height:1.55}
.catalog-item .btn{justify-self:start}
.profile-list{display:grid;gap:8px}
.profile-choice{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;text-align:left}
.profile-choice:hover,.profile-choice.active{background:var(--accent-soft)}
.profile-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.profile-dot img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.profile-choice span:nth-child(2){flex:1}
.profile-choice small{display:block;color:var(--muted);font-weight:400;margin-top:3px}
.account-list-empty{padding:12px;color:var(--muted)}
.auth-field{display:grid;gap:6px;margin-top:14px;font-weight:600}
.auth-field input{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);outline:none}
.auth-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.auth-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.home-top{position:absolute;top:22px;left:34px;right:34px;display:flex;align-items:center}
.logo{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:600;letter-spacing:-.5px}
.logo svg{width:46px;height:36px}
.home-top .sp{flex:1}
.home-top .ib{width:40px;height:40px;font-size:21px;color:var(--text)}
.home .avatar{width:38px;height:38px;font-size:16px;background:rgba(120,130,150,.25);color:var(--text)}
.top-sc{display:grid;grid-template-columns:repeat(5,118px);margin-top:92px}
.sc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px;border-radius:14px;cursor:pointer;font-size:14.5px;transition:background .2s,transform .2s}
.sc:hover{background:rgba(255,255,255,.45);transform:translateY(-3px)}
body.dark .sc:hover{background:rgba(255,255,255,.08)}
.sc img,.sc .em{width:44px;height:44px;object-fit:contain;display:grid;place-items:center;font-size:34px}
.hsearch{margin-top:44px;width:min(640px,90%);height:62px;border-radius:31px;background:linear-gradient(180deg,#f6f7fa,#e9ecf2);box-shadow:inset 0 1px 0 #fff,0 6px 20px rgba(40,60,100,.18);display:flex;align-items:center;padding:0 8px 0 26px}
body.dark .hsearch{background:linear-gradient(180deg,#2a3347,#232b3b)}
.hsearch input{flex:1;border:none;outline:none;background:none;font-size:18px}
.hsearch input::placeholder{color:var(--muted)}
.hsearch button{width:48px;height:48px;border-radius:50%;background:#4b5563;color:#fff;font-size:20px;display:grid;place-items:center;transition:background .2s}
.hsearch button:hover{background:var(--accent)}
.acts{display:grid;grid-template-columns:repeat(5,114px);row-gap:14px;margin-top:38px}
.act{display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;font-size:14px;padding:4px;border-radius:12px}
.act .c{width:72px;height:72px;border-radius:50%;background:var(--circle);box-shadow:0 3px 12px rgba(40,70,120,.14),inset 0 -2px 0 rgba(0,0,0,.04);display:grid;place-items:center;font-size:27px;transition:transform .2s,box-shadow .2s}
.act:hover .c{transform:translateY(-3px);box-shadow:0 8px 20px rgba(40,70,120,.22)}
.act .c img{width:30px;height:30px}
.act.ghost{pointer-events:none}.act.ghost .c{background:transparent;box-shadow:none;border:1px solid var(--line)}
.tagline{margin-top:auto;padding-top:34px;color:var(--muted);font-size:17px}
.recent-sites{width:min(920px,94%);margin-top:22px}
.recent-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.recent-head svg.i{width:16px;height:16px;color:var(--accent)}
.recent-head button{margin-left:auto;padding:5px 9px;border-radius:8px;color:var(--muted);font-size:11px;text-transform:none;letter-spacing:0}
.recent-head button:hover{background:var(--field);color:var(--text)}
.recent-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.recent-site{display:flex;align-items:center;gap:10px;min-width:0;padding:10px;border:1px solid rgba(120,130,150,.18);border-radius:14px;background:color-mix(in srgb,var(--surface) 72%,transparent);text-align:left;transition:transform .15s,background .15s}
.recent-site:hover{transform:translateY(-2px);background:var(--surface)}
.recent-site img{width:30px;height:30px;flex-shrink:0;object-fit:contain}
.recent-site .recent-text{min-width:0;flex:1}
.recent-site b,.recent-site small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-site b{font-size:12px;font-weight:600}
.recent-site small{margin-top:3px;color:var(--muted);font-size:10px}
.recent-empty{padding:14px;color:var(--muted);font-size:12px;text-align:center;border:1px dashed var(--line);border-radius:13px}
.feature-icon{width:100%;height:100%;display:block}
.act .c .feature-icon{width:42px;height:42px}
.sc .feature-icon{width:44px;height:44px}
.mi .feature-icon{width:23px;height:23px}
.tab-menu .feature-icon{width:20px;height:20px}
.dashboard{width:min(920px,94%);display:grid;grid-template-columns:1fr 1.15fr 1.5fr;gap:12px;margin-top:22px}
.dash-card{min-width:0;min-height:112px;padding:14px 16px;border:1px solid rgba(120,130,150,.2);border-radius:18px;background:color-mix(in srgb,var(--surface) 72%,transparent);box-shadow:0 5px 18px rgba(35,50,80,.08);backdrop-filter:blur(10px)}
.dash-title{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.dash-title svg.i{width:16px;height:16px;color:var(--accent)}
.weather-place{margin-left:auto;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;font-weight:500;letter-spacing:0}
.weather-main{display:flex;align-items:center;gap:10px;margin-top:12px}
.weather-symbol{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:var(--accent-soft);color:var(--accent)}
.weather-symbol svg.i{width:24px;height:24px}
.weather-temp{font-size:25px;font-weight:600;letter-spacing:-.04em}
.weather-detail{margin-top:5px;color:var(--muted);font-size:12px}
.weather-locate{margin-left:auto;width:28px;height:28px;border-radius:9px;color:var(--muted);display:grid;place-items:center}
.weather-locate:hover{background:var(--field);color:var(--text)}
.weather-locate svg.i{width:15px;height:15px}
.market-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.market-item{min-width:0;padding:7px 8px;border-radius:11px;background:rgba(120,130,150,.08);text-align:left}
.market-item:hover{background:var(--accent-soft)}
.market-item b,.market-item small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.market-item b{font-size:12px;font-weight:600}
.market-item small{margin-top:4px;color:var(--muted);font-size:11px}
.market-item .up{color:#16845b}.market-item .down{color:#d24444}
.market-item .failed{color:var(--muted)}
.brand-mark{display:block;width:100%;height:100%}
.app-ico .brand-mark{width:34px;height:34px}
.sc .brand-mark{width:44px;height:44px}
.act .brand-mark{width:30px;height:30px}
.bookmark-item img.fav{width:16px;height:16px}
.fav-letter{width:18px;height:18px;border-radius:5px;background:var(--accent-soft);display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0}
body.gray .sc:hover{background:rgba(255,255,255,.08)}
@media(max-height:760px){
  .home{padding-top:16px;padding-bottom:14px}
  .greet{margin-top:60px}
  .dashboard{margin-top:14px}
  .dash-card{min-height:98px;padding:11px 13px}
  .hsearch{margin-top:20px}
  .acts{margin-top:18px}
  .tagline{padding-top:18px}
}
@media(max-width:760px){
  .dashboard{grid-template-columns:1fr 1.2fr}
  .dashboard .market-card{grid-column:1/-1}
  .top-sc{grid-template-columns:repeat(5,minmax(60px,1fr));width:min(590px,100%)}
  .acts{grid-template-columns:repeat(5,minmax(58px,1fr));width:min(570px,100%)}
  .recent-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
  .dashboard{grid-template-columns:1fr}
  .dashboard .market-card{grid-column:auto}
  .top-sc{grid-template-columns:repeat(3,minmax(60px,1fr))}
  .acts{grid-template-columns:repeat(4,minmax(58px,1fr))}
}

/* İç sayfalar */
.inner{max-width:820px;margin:0 auto;padding:36px 28px 60px}
.inner h1{font-size:26px;font-weight:600;margin-bottom:6px}
.inner .sub{color:var(--muted);margin-bottom:22px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer}
.row:hover{background:var(--field)}
.row img{width:18px;height:18px}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row time{color:var(--muted);font-size:12px}
.row .del{opacity:0;width:28px;height:28px;border-radius:50%;color:var(--danger)}
.row:hover .del{opacity:1}.row .del:hover{background:var(--accent-soft)}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 18px;margin-bottom:18px}
.set{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:none}.set small{display:block;color:var(--muted)}
.set input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent)}
.inner select,.inner .search{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--field);padding:0 12px;outline:none}
.inner .search{width:100%;margin-bottom:14px;height:42px;border-radius:21px;padding:0 18px}
.btn{height:36px;padding:0 16px;border-radius:18px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn:hover{filter:brightness(.95)}.btn.red{color:var(--danger)}
.seg{display:flex;background:var(--field);border-radius:12px;padding:3px}
.seg button{padding:6px 14px;border-radius:9px}.seg button.on{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}

/* ================= Yumuşak tasarım katmanı (v1.2) ================= */
:root{--r-lg:16px;--r-md:12px;--ease:cubic-bezier(.2,.8,.2,1)}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
.ib svg.i{width:18px;height:18px}
.ib{transition:background .18s var(--ease),color .18s,transform .12s}
.ib:active:not(:disabled){transform:scale(.92)}
.ib.on{color:#f5b301}.ib.on svg.i path{fill:#f5b301}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:rgba(120,130,150,.35);border-radius:10px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(120,130,150,.6);background-clip:content-box;border:3px solid transparent}
*::-webkit-scrollbar-track{background:transparent}

/* sekmeler */
.strip{height:42px;padding-top:8px}
.tab{height:34px;border-radius:12px 12px 0 0;transition:background .18s var(--ease),box-shadow .18s;animation:tabIn .22s var(--ease)}
@keyframes tabIn{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.tab.active{box-shadow:0 -2px 10px rgba(35,70,130,.10)}
.tab .ico svg.i{width:15px;height:15px;color:var(--accent)}
.tab .x{transition:background .15s,color .15s}
.tab .x svg.i{width:13px;height:13px}
.tab .aud{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex-shrink:0}
.tab .aud[hidden]{display:none}
.tab .aud:hover{background:rgba(120,130,150,.25)}
.tab .aud svg.i{width:13px;height:13px}
.tab.muted .aud{color:var(--muted)}
.plus{width:30px;height:30px;transition:background .18s,transform .12s}
.plus svg.i{width:17px;height:17px}

/* gezinme çubuğu */
.nav{height:48px;box-shadow:0 1px 0 var(--line),0 6px 16px -12px rgba(35,70,130,.25);border-bottom:none}
.addr{height:36px;border-radius:18px;padding-left:42px;transition:background .18s,box-shadow .18s,border-color .18s}
.addr:hover:not(:focus){background:color-mix(in srgb,var(--field) 80%,var(--accent) 6%)}
.addr-lock{left:15px;display:flex}
.addr-lock svg.i{width:15px;height:15px}
.addr-star{top:3px}
.suggest{border-radius:16px;top:42px;animation:pop .14s var(--ease)}
.sg{border-radius:11px}
.sg span:first-child{display:flex}.sg span:first-child svg.i{width:15px;height:15px;color:var(--muted)}
.avatar{border:none;transition:transform .15s,box-shadow .15s}
.avatar:hover{transform:scale(1.07);box-shadow:0 2px 10px rgba(35,70,130,.2)}
.private-badge{border-radius:14px;padding:6px 11px}
.private-badge svg.i{width:14px;height:14px}

/* menüler */
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.menu{border-radius:18px;padding:8px;width:288px;max-height:calc(100vh - 66px);overflow-y:auto;top:50px}
.menu.show,.tab-menu.show,.find.show{animation:pop .15s var(--ease)}
.mi{border-radius:11px;padding:8px 12px;transition:background .12s}
.mi span:first-child{display:grid;place-items:center;width:20px;color:var(--muted)}
.mi span:first-child svg.i{width:17px;height:17px}
.mi:hover span:first-child{color:var(--accent)}
.tab-menu{border-radius:14px;padding:6px;min-width:210px}
.tab-menu button{border-radius:9px;display:flex;align-items:center;gap:10px}
.tab-menu button svg.i{width:15px;height:15px;color:var(--muted)}
.find{border-radius:16px;padding:7px 10px}
.find .ib svg.i{width:15px;height:15px}
.toast{border-radius:14px;padding:11px 20px;backdrop-filter:blur(8px);background:rgba(31,41,55,.92)}

/* yer imi çubuğu */
.bookmarks-bar{height:38px}
.bookmark-item{border-radius:9px;transition:background .15s}

/* ana sayfa */
.greet{margin-top:76px;text-align:center;line-height:1.1}
.greet b{display:block;font-size:44px;font-weight:300;letter-spacing:-1px}
.greet span{display:block;margin-top:6px;color:var(--muted);font-size:14.5px}
.top-sc{margin-top:22px}
.sc{border-radius:16px}
.sc .em svg.i{width:34px;height:34px;color:var(--accent)}
.hsearch{margin-top:30px;transition:box-shadow .2s,transform .2s}
.hsearch:focus-within{box-shadow:inset 0 1px 0 #fff,0 10px 30px rgba(47,111,228,.25);transform:translateY(-1px)}
.hsearch button svg.i{width:21px;height:21px}
.acts{margin-top:30px}
.act .c{width:68px;height:68px;color:var(--text)}
.act .c svg.i{width:26px;height:26px}
.act:hover .c{color:var(--accent)}
.home-top .ib{width:40px;height:40px}
.home-top .ib svg.i{width:21px;height:21px}
.private-mark svg.i{width:28px;height:28px}
.card{border-radius:18px;box-shadow:0 1px 3px rgba(35,70,130,.05)}
.btn{transition:background .15s,filter .15s,transform .1s}.btn:active{transform:scale(.97)}
.catalog-item{border-radius:14px;transition:box-shadow .18s,transform .18s}
.catalog-item:hover{box-shadow:var(--shadow);transform:translateY(-2px)}

/* HTML tam ekran: film / video */
body.html-fs .strip,body.html-fs .nav,body.html-fs .bookmarks-bar,body.html-fs .find,body.html-fs .menu,body.html-fs .tab-menu{display:none!important}
body.html-fs .views{position:fixed;inset:0;z-index:5;background:#000}
.tab.loading .ico svg{display:none}
.catalog-head{display:flex;align-items:center;gap:12px}
.catalog-head h2{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-ico{width:46px;height:46px;border-radius:13px;background:var(--circle);display:grid;place-items:center;flex-shrink:0;box-shadow:0 2px 8px rgba(35,70,130,.16),inset 0 -2px 0 rgba(0,0,0,.04);transition:transform .2s var(--ease),box-shadow .2s}
.app-ico img{width:28px;height:28px;object-fit:contain}
.site-icon{width:44px;height:44px;position:relative;display:grid;place-items:center;flex-shrink:0;overflow:hidden;border-radius:14px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 18%,var(--surface)),var(--surface));box-shadow:0 5px 15px rgba(25,40,70,.16),inset 0 0 0 1px rgba(120,130,150,.13);transition:transform .2s,box-shadow .2s}
.site-icon .brand-mark{width:100%;height:100%;padding:5px}
.site-icon .site-favicon{position:absolute;width:27px;height:27px;object-fit:contain;border-radius:7px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
.sc:hover .site-icon{transform:translateY(-3px) rotate(-4deg);box-shadow:0 9px 20px rgba(25,40,70,.22)}
.act .site-icon{width:38px;height:38px;border-radius:13px}
.act .site-icon .site-favicon{width:25px;height:25px}
.app-ico .site-icon{width:38px;height:38px;border-radius:12px;background:transparent;box-shadow:none}
.app-ico .site-icon .site-favicon{width:29px;height:29px}
.bookmark-item img.fav{width:16px;height:16px}
.bookmark-item .fav-letter{width:16px;height:16px}
.row img.fav{width:24px;height:24px;object-fit:contain}
.row .fav-letter{width:24px;height:24px;border-radius:7px;font-size:12px}
.catalog-item:hover .app-ico{transform:scale(1.08) rotate(-3deg);box-shadow:0 6px 16px rgba(35,70,130,.24)}
.fav-letter{font-size:20px;font-weight:700;color:var(--accent)}
.catalog-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.inner h2{font-size:18px;font-weight:600}
</style>
</head>

function weatherDescription(code){

  if([45,48].includes(code))return ['Sisli','cloud'];
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))return ['Yağmurlu','rain'];
  if([71,73,75,77,85,86].includes(code))return ['Karlı','snow'];

const dashboardRequestCache=new Map();
async function fetchDashboardJson(url){
  const cached=dashboardRequestCache.get(url);
  if(cached&&(cached.promise||cached.expires>Date.now()))return cached.promise||cached.data;
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);
  const promise=fetch(url,{signal:controller.signal}).then(response=>{
    if(!response.ok)throw new Error(`Veri servisi (${response.status})`);
    return response.json();
  }).then(data=>{
    dashboardRequestCache.set(url,{data,expires:Date.now()+300000});
    return data;
  }).catch(error=>{
    dashboardRequestCache.delete(url);
    throw error.name==='AbortError'?new Error('Veri isteği zaman aşımına uğradı'):error;
  }).finally(()=>clearTimeout(timeout));
  dashboardRequestCache.set(url,{promise,expires:0});
  return promise;
}

function toUrl(v){

function validCloudUrl(value){

function sanitizeCloudData(data){
  const allowedEngines=Object.keys(ENGINES);
  const cloudSettings=data.settings&&typeof data.settings==='object'?data.settings:{};
  return {
    bookmarks:(Array.isArray(data.bookmarks)?data.bookmarks:[]).filter(item=>item&&typeof item.url==='string'&&validCloudUrl(item.url)).slice(0,5000).map(item=>({url:item.url,title:typeof item.title==='string'?item.title.slice(0,512):item.url})),

function scheduleCloudSync(){
  if(!localAccount||cloudHydrating)return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer=setTimeout(()=>pushCloudData(),1200);
}
function pushCloudData(){
  if(!localAccount)return Promise.resolve(false);
  clearTimeout(cloudSyncTimer);
  const payload=JSON.parse(JSON.stringify(currentCloudData()));
  const profileId=activeProfileId;
  const operation=cloudSyncQueue.catch(()=>{}).then(async()=>{
    const result=await ipcRenderer.invoke('sync:push',payload,profileId);
    if(result?.error)throw new Error(result.error);
  });
  cloudSyncQueue=operation;
  return operation.then(()=>{cloudErrorShown=false;return true}).catch(error=>{
    if(!cloudErrorShown){toast('Bulut eşitlemesi başarısız: '+error.message);cloudErrorShown=true}
    return false;
  });
}
async function pullCloudData(){
  const result=await ipcRenderer.invoke('sync:pull',activeProfileId);
  if(result?.error)throw new Error(result.error);
  if(result.data){
    cloudHydrating=true;
    try{
      const cloudData=sanitizeCloudData(result.data);
      bookmarks=cloudData.bookmarks;
      history=cloudData.history;
      settings=cloudData.settings;
      store.set('bookmarks',bookmarks);store.set('history',history);store.set('settings',settings);
      renderBookmarksBar();applyTheme();updateUI();
    }finally{cloudHydrating=false}
    toast('Yer imleri ve tercihler buluttan alındı');
  }else if(!await pushCloudData())throw new Error('İlk bulut kaydı oluşturulamadı. Yerel verilerin korunuyor.');
  cloudInitializedProfiles.add(activeProfileId);
}

  tab.el.addEventListener('mousedown',e=>{ if(e.button===1){e.preventDefault();closeTab(tab.id)} });
  tab.el.addEventListener('click',e=>{
    if(e.target.closest('.x')) closeTab(tab.id);
    else if(e.target.closest('.aud')) toggleMute(tab);
    else activate(tab.id);
  });
  tab.el.addEventListener('contextmenu',e=>{e.preventDefault();showTabMenu(tab,e)});
  $('#tabs').appendChild(tab.el);
  tabs.push(tab);
  navigate(tab, input);
  if(!background) activate(tab.id);
  renderTab(tab); fitTabs();
  return tab;
}
function renderTab(t){
  const img=t.el.querySelector('img'), dflt=t.el.querySelector('[data-d]');
  t.el.querySelector('.ttl').textContent=t.title||'Yeni sekme';
  t.el.title=t.title||'';
  t.el.classList.toggle('active',t.id===activeId);
  t.el.classList.toggle('loading',t.loading);
  if(t.id===activeId)$('#reload').innerHTML=icon(t.loading?'x':'reload');
  t.el.classList.toggle('private',t.private);
  t.el.classList.toggle('pinned',t.pinned);
  if(t.group) t.el.dataset.group=t.group;
  else delete t.el.dataset.group;
  const wantIcon=t.private?'incognito':'zap';
  if(dflt.dataset.ic!==wantIcon){dflt.innerHTML=icon(wantIcon);dflt.dataset.ic=wantIcon}
  const aud=t.el.querySelector('.aud');
  aud.hidden=!(t.audible||t.muted);
  aud.innerHTML=icon(t.muted?'volumeOff':'volume');
  t.el.classList.toggle('muted',Boolean(t.muted));
  t.el.title=(t.private?'Gizli sekme · ':'')+(t.title||'');
  const iconUrl=t.icon||(!t.private&&t.url?faviconUrl(host(t.url)):'');
  if(iconUrl && !t.loading){
    if(img.dataset.value!==iconUrl){img.dataset.value=iconUrl;img.dataset.failed='';img.src=iconUrl}
    img.hidden=Boolean(img.dataset.failed);dflt.hidden=!img.hidden
  }else{img.hidden=true;img.dataset.failed='';img.dataset.value='';dflt.hidden=false}
}
function fitTabs(){
  const t=active();
  t?.el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
}
function activate(id){
  activeId=id;
  tabs.forEach(t=>{t.view.classList.toggle('active',t.id===id);renderTab(t)});
  fitTabs();
  updateUI(); closeFind();
  if(!active().url){
    if(!active().private)loadDashboardData(active().page);
    setTimeout(()=>$('#addr').focus(),30);
  }
  else active().wv?.focus();
}
function renderTabFinder(){
  const query=$('#tabFindInput').value.trim().toLocaleLowerCase('tr-TR');
  const matching=tabs.filter(tab=>`${tab.title} ${tab.url}`.toLocaleLowerCase('tr-TR').includes(query));
  $('#tabFinderResults').innerHTML=matching.length?matching.map(tab=>{
    const label=tab.title||'Yeni sekme',domain=tab.url?host(tab.url):'velocita';
    const src=tab.icon||(!tab.private&&tab.url?faviconUrl(domain):'');
    const leading=src?`<img class="result-icon" src="${esc(src)}" alt="" loading="lazy" decoding="async" data-name="${esc(label)}" data-seed="${esc(domain)}">`:`<span class="result-icon">${icon(tab.private?'incognito':'zap')}</span>`;
    return `<button class="tab-finder-row" data-tab-id="${tab.id}" title="${esc(tab.url||label)}">${leading}<span>${tab.private?'Gizli · ':''}${esc(label)}</span></button>`;
  }).join(''):'<div class="tab-finder-empty">Eşleşen sekme bulunamadı</div>';
}
function openTabFinder(){
  $('#tabFinder').classList.add('show');
  renderTabFinder();
  $('#tabFindInput').focus();
  $('#tabFindInput').select();
}
function closeTabFinder(){$('#tabFinder').classList.remove('show')}
function renderRecentSites(root){
  const list=root?.querySelector('#recentSites');if(!list)return;
  const recent=history.filter(item=>item&&typeof item.url==='string'&&/^https?:/i.test(item.url)).slice(0,4);
  if(!recent.length){list.innerHTML='<div class="recent-empty">Ziyaret ettiğin sayfalar burada görünecek.</div>';return}
  list.innerHTML=recent.map(item=>`<button class="recent-site" data-go="${esc(item.url)}" title="${esc(item.url)}"><img class="fav" src="${fav(item.url)}" alt="" data-letter="${esc((item.title||host(item.url)).slice(0,1).toLocaleUpperCase('tr-TR'))}"><span class="recent-text"><b>${esc(item.title||host(item.url))}</b><small>${esc(host(item.url))} · ${timeAgo(item.t)}</small></span></button>`).join('');
}
function showTabMenu(tab,e){
  contextTabId=tab.id;
  const groups=[['','Grup yok'],['work','İş'],['personal','Kişisel'],['research','Araştırma'],['other','Diğer']];
  const menu=$('#tabMenu');
  menu.innerHTML=`<button data-tab-act="reload">${icon('reload')}Yenile</button><button data-tab-act="duplicate">${icon('copy')}Sekmeyi çoğalt</button><button data-tab-act="mute">${icon(tab.muted?'volume':'volumeOff')}${tab.muted?'Sesi aç':'Sekmeyi sessize al'}</button><button data-tab-act="pin">${icon('pin')}${tab.pinned?'Sabitlemeyi kaldır':'Sekmeyi sabitle'}</button><div class="msep"></div>${groups.map(([id,label])=>`<button data-tab-act="group" data-group="${id}" aria-pressed="${tab.group===id}">${tab.group===id?icon('check'):'<span style="width:15px"></span>'}${label}</button>`).join('')}<div class="msep"></div><button data-tab-act="closeOthers">${icon('x')}Diğer sekmeleri kapat</button><button data-tab-act="close">${icon('x')}Sekmeyi kapat</button>`;
  menu.style.left=Math.max(8,Math.min(e.clientX,innerWidth-205))+'px';
  menu.style.top=Math.max(8,Math.min(e.clientY,innerHeight-380))+'px';
  menu.classList.add('show');
}
function updateTabOrder(tab){
  const oldIndex=tabs.indexOf(tab);
  if(oldIndex<0) return;
  tabs.splice(oldIndex,1);
  const firstUnpinned=tabs.findIndex(item=>!item.pinned);
  const index=firstUnpinned<0?tabs.length:firstUnpinned;
  tabs.splice(index,0,tab);
  $('#tabs').insertBefore(tab.el,tabs[index+1]?.el||null);
}
function handleTabAction(action,group=''){
  const tab=tabs.find(item=>item.id===contextTabId);
  $('#tabMenu').classList.remove('show');
  if(!tab) return;
  if(action==='pin'){tab.pinned=!tab.pinned;updateTabOrder(tab);renderTab(tab);fitTabs()}
  if(action==='group'){tab.group=group;renderTab(tab)}
  if(action==='close')closeTab(tab.id);
  if(action==='reload'){tab.wv&&tab.ready?tab.wv.reload():navigate(tab,tab.url)}
  if(action==='duplicate'&&tab.url&&!tab.url.startsWith('velocita://'))newTab(tab.url,false,tab.private);
  else if(action==='duplicate')newTab(tab.url||'',false,tab.private);
  if(action==='mute')toggleMute(tab);
  if(action==='closeOthers')[...tabs].filter(item=>item!==tab&&!item.pinned).forEach(item=>closeTab(item.id));
}
function toggleMute(tab){
  if(!tab?.wv||!tab.ready)return toast('Bir web sayfası açın');
  tab.muted=!tab.muted;
  try{tab.wv.setAudioMuted(tab.muted)}catch{}
  renderTab(tab);
  toast(tab.muted?'Sekme sessize alındı':'Ses açıldı');
}
function closeTab(id){
  const i=tabs.findIndex(t=>t.id===id); if(i<0) return;
  const t=tabs[i];
  if(t.url&&!t.private) closed.push(t.url);
  t.el.remove(); t.view.remove(); tabs.splice(i,1);
  if(t.private&&!tabs.some(item=>item.private)) ipcRenderer.invoke('clear-private-data',activeProfileId).catch(()=>{});
  if(!tabs.length){newTab();return}
  if(activeId===id) activate((tabs[i]||tabs[i-1]).id);
}
function cycleTab(dir){
  const i=tabs.findIndex(t=>t.id===activeId);
  activate(tabs[(i+dir+tabs.length)%tabs.length].id);
}

/* ---------- Gezinme ---------- */
function navigate(tab, input){
  const url = toUrl(input);
  if(!url){ showPage(tab,'home'); return }
  if(INTERNAL[url]){ showPage(tab,url); return }
  tab.view.innerHTML=''; tab.page=null; tab.ready=false;
  const wv=document.createElement('webview');
  wv.setAttribute('partition',tab.private?PRIVATE_PARTITION:PARTITION);
  wv.setAttribute('allowpopups','');
  tab.wv=wv; tab.url=url; tab.title=host(url); tab.icon='';
  wireWebview(tab);
  wv.src=url;
  tab.view.appendChild(wv);
  renderTab(tab); if(tab.id===activeId) updateUI();
}
function wireWebview(tab){
  const wv=tab.wv, cur=()=>tab.id===activeId;
  wv.addEventListener('dom-ready',()=>{tab.ready=true;wv.setZoomFactor(tab.zoom);if(tab.muted)try{wv.setAudioMuted(true)}catch{};syncNavigationState(tab);if(cur())updateUI()});
  wv.addEventListener('did-start-loading',()=>{tab.loading=true;renderTab(tab);syncNavigationState(tab)});
  wv.addEventListener('did-stop-loading',()=>{tab.loading=false;renderTab(tab);syncNavigationState(tab);if(cur())updateUI()});
  wv.addEventListener('did-navigate',e=>{if(e.isMainFrame!==false){tab.url=e.url;syncNavigationState(tab);if(cur())updateUI()}});
  wv.addEventListener('did-navigate-in-page',e=>{if(e.isMainFrame){tab.url=e.url;syncNavigationState(tab);if(cur())updateUI()}});
  wv.addEventListener('page-title-updated',e=>{tab.title=e.title;renderTab(tab);if(!tab.private)addHistory(tab.url,e.title)});
  wv.addEventListener('page-favicon-updated',e=>{tab.icon=e.favicons[0]||'';renderTab(tab)});
  wv.addEventListener('did-fail-load',e=>{syncNavigationState(tab);if(e.isMainFrame&&e.errorCode!==-3){tab.title='Sayfa açılamadı';renderTab(tab);toast('Sayfa açılamadı: '+e.errorDescription)}});
  wv.addEventListener('found-in-page',e=>{const r=e.result;$('#findCt').textContent=r.matches?`${r.activeMatchOrdinal}/${r.matches}`:'Yok'});
  wv.addEventListener('media-started-playing',()=>{tab.audible=true;renderTab(tab)});
  wv.addEventListener('media-paused',()=>{tab.audible=false;renderTab(tab)});
  // Tam ekran: ana süreç pencereyi tam ekran yapar ve 'html-fullscreen' olayını gönderir
}
function canGo(tab,dir){
  if(!tab?.wv)return false;
  try{return Boolean(dir<0?tab.wv.canGoBack():tab.wv.canGoForward())}catch{return false}
}
function syncNavigationState(tab){
  const sync=()=>{
    tab.canBack=canGo(tab,-1)||Boolean(tab.url);
    tab.canForward=canGo(tab,1);
    if(tab.id===activeId){$('#back').disabled=!tab.canBack;$('#fwd').disabled=!tab.canForward}
  };
  sync();
  requestAnimationFrame(sync);
}
function updateUI(){
  const t=active(); if(!t) return;
  const a=$('#addr');
  if(document.activeElement!==a) a.value = t.url && !t.url.startsWith('velocita://') ? t.url : (t.url||'');
  $('#lock').innerHTML = icon(t.url.startsWith('https://') ? 'lock' : t.url.startsWith('http://') ? 'warn' : 'search');
  $('#back').disabled=!(t.canBack=canGo(t,-1)||Boolean(t.url)); $('#fwd').disabled=!(t.canForward=canGo(t,1));
  const bm=bookmarks.some(b=>b.url===t.url);
  $('#star').innerHTML=icon('star'); $('#star').classList.toggle('on',bm);
  $('#privateBadge').hidden=!t.private;
  const profileButton=$('#profileBtn');
  const avatarUrl=localAccount?.avatarUrl;
  profileButton.title=localAccount?.email||activeProfile().name;
  if(avatarUrl){
    let avatarImage=profileButton.querySelector('img');
    if(!avatarImage||avatarImage.dataset.url!==avatarUrl){
      avatarImage=document.createElement('img');
      avatarImage.alt='';
      avatarImage.referrerPolicy='no-referrer';
      avatarImage.dataset.url=avatarUrl;
      avatarImage.src=avatarUrl;
      avatarImage.addEventListener('error',()=>{
        if(localAccount?.avatarUrl===avatarUrl){localAccount.avatarUrl=null;updateUI()}
      },{once:true});
      profileButton.replaceChildren(avatarImage);
    }
  }else{
    profileButton.textContent=activeProfile().name.slice(0,1).toLocaleUpperCase('tr-TR');
  }
  $('#zoomVal').textContent=Math.round(t.zoom*100)+'%';
  document.title = (t.title||'Velocita')+' - Velocita';
}

/* ---------- Geçmiş & yer imleri ---------- */
function addHistory(url,title){
  if(!url||!url.startsWith('http')) return;
  const i=history.findIndex(h=>h.url===url); if(i>=0) history.splice(i,1);
  history.unshift({url,title:title||url,t:Date.now()});
  history=history.slice(0,600); store.set('history',history);
  tabs.forEach(tab=>tab.page?.querySelector('#recentSites')&&renderRecentSites(tab.page));
}
function toggleBookmark(){
  const t=active(); if(!t||!t.url||t.url.startsWith('velocita://')) return;
  const i=bookmarks.findIndex(b=>b.url===t.url);
  if(i>=0){bookmarks.splice(i,1);toast('Sık kullanılanlardan kaldırıldı')}
  else{bookmarks.unshift({url:t.url,title:t.title||t.url});toast('Sık kullanılanlara eklendi')}
  store.set('bookmarks',bookmarks); renderBookmarksBar(); updateUI();
}
function renderBookmarksBar(){
  $('#bookmarksBar').hidden=!settings.bookmarksBar;
  $('#bookmarkItems').innerHTML=bookmarks.length?bookmarks.map(b=>`<button class="bookmark-item" data-go="${esc(b.url)}" title="${esc(b.title||b.url)}"><img class="fav" src="${fav(b.url)}" alt="" data-letter="${esc((b.title||host(b.url)).slice(0,1).toLocaleUpperCase('tr-TR'))}"><span>${esc(b.title||host(b.url))}</span></button>`).join(''):'<span class="bookmark-empty">Henüz sık kullanılan yok</span>';
}

    const list=history.filter(h=>(h.title+h.url).toLowerCase().includes(q.toLowerCase())).slice(0,200);
    return `<div class="inner"><h1>Geçmiş</h1><p class="sub"><button class="btn red" data-act="clearhist">Geçmişi temizle</button></p>
      <input class="search" id="hq" placeholder="Geçmişte ara" value="${esc(q)}">`+
      (list.length?list.map(h=>`<div class="row" data-go="${esc(h.url)}"><img class="fav" src="${fav(h.url)}" alt="" data-letter="${esc((h.title||'?').slice(0,1).toLocaleUpperCase('tr-TR'))}"><div class="t"><b>${esc(h.title)}</b><small>${esc(h.url)}</small></div><time>${timeAgo(h.t)}</time></div>`).join(''):'<div class="empty">Sonuç bulunamadı.</div>')+'</div>';
  }
  return `<div class="inner"><h1>Ayarlar</h1><p class="sub">Velocita'yı kendine göre ayarla.</p>
    <div class="card">
      <div class="set"><div>Arama motoru<small>Adres çubuğundan yapılan aramalar. Yazarken öneriler bu arama motoruna gönderilir.</small></div>
        <select data-set="engine">${Object.keys(ENGINES).map(e=>`<option ${e===settings.engine?'selected':''}>${e}</option>`).join('')}</select></div>
      <div class="set"><div>Tema<small>Arayüz görünümü</small></div>
        <div class="seg">${[['light','Açık'],['dark','Koyu mavi'],['gray','Gri'],['auto','Sistem']].map(([v,l])=>`<button data-act="theme" data-v="${v}" class="${settings.theme===v?'on':''}">${l}</button>`).join('')}</div></div>
      <div class="set"><div>Vurgu rengi<small>Etkin kontroller ve vurgular</small></div><input type="color" data-set="accent" value="${esc(settings.accent)}"></div>
      <div class="set"><div>Yer imleri çubuğu<small>Gezinme çubuğunun altında göster</small></div><input type="checkbox" data-set="bookmarksBar" ${settings.bookmarksBar?'checked':''}></div>

    </div>
    <div class="card">
      <div class="set"><div>Gezinme verileri<small>Çerezler, önbellek ve site verileri</small></div><button class="btn red" data-act="cleardata">Temizle</button></div>
      <div class="set"><div>Sık kullanılanlar<small>${bookmarks.length} kayıt</small></div><button class="btn red" data-act="clearbm">Tümünü sil</button></div>
      <div class="set"><div>Site izinleri<small>Bu oturumdaki kamera, mikrofon ve diğer izin kararları</small></div><button class="btn" data-act="permissions">Yönet</button></div>

/* ---------- Eylemler ---------- */
function zoom(d){
  const t=active(); if(!t?.wv) return;
  t.zoom = d===0 ? 1 : Math.min(3,Math.max(.25,Math.round((t.zoom+d)*100)/100));
  if(t.ready) t.wv.setZoomFactor(t.zoom); updateUI(); toast('Yakınlaştırma: %'+Math.round(t.zoom*100));
}
function openFind(){const t=active(); if(!t?.wv){return} $('#find').classList.add('show');$('#findIn').focus();$('#findIn').select()}
function closeFind(){$('#find').classList.remove('show');const t=active();try{t?.wv?.stopFindInPage('clearSelection')}catch{}$('#findCt').textContent=''}
function doFind(forward=true,next=false){const t=active();const v=$('#findIn').value;if(!t?.wv||!v){try{t?.wv?.stopFindInPage('clearSelection')}catch{}$('#findCt').textContent='';return}t.wv.findInPage(v,{forward,findNext:next})}
function formatBytes(value){
  const bytes=Number(value)||0;
  if(bytes<1024)return `${bytes} B`;
  const units=['KB','MB','GB','TB'];
  let size=bytes/1024,index=0;
  while(size>=1024&&index<units.length-1){size/=1024;index++}
  return `${size.toFixed(size>=100?0:1)} ${units[index]}`;
}
function openInternal(name){const t=active();if(t.url===''&&!t.wv)showPage(t,name);else newTab(name);if(name==='velocita://uzantilar')loadExtensions();if(name==='velocita://izinler')loadPermissions();if(name==='velocita://indirmeler')loadDownloads();if(name==='velocita://profiller')loadAuthStatus()}
async function loadExtensions(){
  try{
    extensions=await ipcRenderer.invoke('extensions:list',activeProfileId);
    const t=active();
    if(t?.url==='velocita://uzantilar'&&t.page)t.page.innerHTML=innerHTML(t.url);
  }catch{toast('Uzantı listesi alınamadı')}
}
async function loadPermissions(){
  try{
    permissions=await ipcRenderer.invoke('permissions:list',activeProfileId);
    const t=active();
    if(t?.url==='velocita://izinler'&&t.page)t.page.innerHTML=innerHTML(t.url);
  }catch{toast('Site izinleri alınamadı')}
}
async function loadDownloads(){
  try{
    downloads=await ipcRenderer.invoke('downloads:list',Boolean(active()?.private),activeProfileId);
    const t=active();
    if(t?.url==='velocita://indirmeler'&&t.page)t.page.innerHTML=innerHTML(t.url);
  }catch{toast('İndirme listesi alınamadı')}
}
async function loadProfileAccounts(){
  const entries=await Promise.all(profiles.map(async profile=>{
    try{
      const result=await ipcRenderer.invoke('auth:getSession',profile.id);
      if(result?.error)throw new Error(result.error);
      return [profile.id,result.user];
    }catch(error){
      console.warn(`Profil hesabı alınamadı (${profile.name}):`,error);
      return [profile.id,null];
    }
  }));
  profileAccounts=new Map(entries.filter(([,account])=>account));
}
async function loadAuthStatus(syncCloud=true){
  try{
    const result=await ipcRenderer.invoke('auth:getSession',activeProfileId);
    if(result?.error)throw new Error(result.error);
    localAccount=result.user;
    updateUI();
    if(syncCloud&&localAccount&&!cloudInitializedProfiles.has(activeProfileId)){
      try{await pullCloudData()}catch(error){toast('Bulut verisi alınamadı: '+error.message)}
    }
  }catch(error){toast(error.message||'Hesap durumu alınamadı')}
  const t=active();
  if(t?.url==='velocita://profiller'&&t.page){
    await loadProfileAccounts();
    t.page.innerHTML=innerHTML(t.url);
  }
}
async function submitCloudAuth(channel){
  const email=$('#authEmail')?.value.trim();
  const password=$('#authPassword')?.value;
  if(!email||!password)return toast('E-posta ve parola alanlarını doldurun');
  authLoading=true;
  const page=active()?.page;
  if(page?.querySelector('[data-act="authSignUp"]'))page.innerHTML=innerHTML('velocita://profiller');
  try{
    const result=await ipcRenderer.invoke(channel,email,password,activeProfileId);
    if(result?.error)throw new Error(result.error);
    if(result.requiresEmailConfirmation){toast('Hesabını etkinleştirmek için e-postandaki bağlantıya tıkla.');return}
    localAccount=result.user;
    updateUI();
    cloudInitializedProfiles.delete(activeProfileId);
    await pullCloudData();
    toast(channel==='auth:signUp'?'Hesap oluşturuldu ve veriler eşitlendi':'Giriş yapıldı ve veriler eşitlendi');
  }catch(error){toast(error.message||'Kimlik doğrulama başarısız oldu')}
  finally{
    authLoading=false;
    const t=active();
    if(t?.url==='velocita://profiller'&&t.page)t.page.innerHTML=innerHTML(t.url);
  }
}
const actions={
  newtab:()=>newTab(),
  pip:async()=>{
    const t=active();if(!t?.wv||!t.ready)return toast('Önce bir video sayfası açın');
    try{
      const r=await t.wv.executeJavaScript(`(async()=>{const vs=[...document.querySelectorAll('video')].filter(v=>v.readyState>0);if(!vs.length)return 'none';if(document.pictureInPictureElement){await document.exitPictureInPicture();return 'exit'}vs.sort((a,b)=>(b.videoWidth*b.videoHeight)-(a.videoWidth*a.videoHeight));await vs[0].requestPictureInPicture();return 'ok'})()`,true);
      if(r==='none')toast('Sayfada video bulunamadı');
    }catch{toast('Resim içinde resim bu videoda desteklenmiyor')}
  },
  screenshot:async()=>{
    const t=active();if(!t?.wv||!t.ready)return toast('Önce bir web sayfası açın');
    const r=await ipcRenderer.invoke('tools:screenshot',t.wv.getWebContentsId());
    if(r?.error)toast(r.error);else if(!r?.canceled)toast('Ekran görüntüsü kaydedildi');
  },
  mute:()=>toggleMute(active()),
  copyurl:async()=>{const t=active();if(!t?.url)return;try{await navigator.clipboard.writeText(t.url);toast('Adres kopyalandı')}catch{toast('Kopyalanamadı')}},
  newprivate:()=>newTab('',false,true),
  reopen:()=>{const u=closed.pop();u?newTab(u):toast('Kapatılmış sekme yok')},
  bookmarks:()=>openInternal('velocita://sik-kullanilanlar'),
  history:()=>openInternal('velocita://gecmis'),
  settings:()=>openInternal('velocita://ayarlar'),
  extensions:()=>openInternal('velocita://uzantilar'),
  permissions:()=>openInternal('velocita://izinler'),
  downloads:()=>openInternal('velocita://indirmeler'),
  profiles:()=>openInternal('velocita://profiller'),
  store:()=>openInternal('velocita://store'),
  activateProfile:async d=>{
    if(!profiles.some(profile=>profile.id===d.profile)||d.profile===activeProfileId)return;
    localStorage.setItem('velocita_active_profile',d.profile);
    await ipcRenderer.invoke('profiles:activate',d.profile);
    location.reload();
  },
  createProfile:async()=>{
    const name=$('#newProfileName')?.value.trim();
    if(!name)return toast('Bir profil adı yazın');
    if(profiles.length>=20)return toast('En fazla 20 profil oluşturulabilir');
    const id=crypto.randomUUID().replaceAll('-','');
    profiles.push({id,name:name.slice(0,32)});
    saveProfiles();
    localStorage.setItem('velocita_active_profile',id);
    await ipcRenderer.invoke('profiles:activate',id);
    location.reload();
  },
  addGoogleAccount:async()=>{
    if(profiles.length>=20)return toast('En fazla 20 profil oluşturulabilir');
    let number=1;
    while(profiles.some(profile=>profile.name===`Google hesabı ${number}`))number++;
    const id=crypto.randomUUID().replaceAll('-','');
    const profile={id,name:`Google hesabı ${number}`};
    profiles.push(profile);
    try{
      const activated=await ipcRenderer.invoke('profiles:activate',id);
      if(!activated)throw new Error('Yeni hesap profili etkinleştirilemedi.');
      saveProfiles();
      localStorage.setItem('velocita_active_profile',id);
      localStorage.setItem(PENDING_GOOGLE_ACCOUNT_KEY,id);
      location.reload();
    }catch(error){
      profiles=profiles.filter(item=>item.id!==id);
      toast(error.message||'Yeni hesap profili oluşturulamadı');
    }
  },
  authSignUp:()=>submitCloudAuth('auth:signUp'),
  authSignIn:()=>submitCloudAuth('auth:signIn'),
  authSignInGoogle:async()=>{
    const result=await ipcRenderer.invoke('auth:signInGoogle',activeProfileId);
    if(result?.error)toast('Google girişi başlatılamadı: '+result.error);
    else toast('Google girişini varsayılan tarayıcıda tamamlayın');
  },
  authSignOut:async()=>{
    if(!await pushCloudData())return toast('Bulut eşitlemesi başarısız; çıkış yapılmadı.');
    const result=await ipcRenderer.invoke('auth:signOut',activeProfileId);
    if(result?.error)return toast(result.error);
    localAccount=null;
    updateUI();
    cloudInitializedProfiles.delete(activeProfileId);
    toast('Çıkış yapıldı; yerel verilerin korundu');
    refreshPage();
  },
  addApp:d=>{
    const item=STORE_APPS.find(app=>app.id===d.app);
    if(!item)return;
    settings.shortcuts=[...new Set([...(settings.shortcuts||[]),item.id])];
    saveSettings();
    refreshPage();
    toast(`${item.name} ana sayfaya eklendi`);
  },
  download:async(action,id)=>{
    if(action==='clear')await ipcRenderer.invoke('downloads:clear',Boolean(active()?.private),activeProfileId);
    else if(action==='open'||action==='show'){
      const result=await ipcRenderer.invoke(`downloads:${action}`,id,activeProfileId);
      if(result?.error)toast(result.error);
    }else await ipcRenderer.invoke('downloads:control',id,action,activeProfileId);
    await loadDownloads();
  },
  installExtension:async()=>{
    const result=await ipcRenderer.invoke('extensions:install',activeProfileId);
    if(result?.error)toast('Uzantı yüklenemedi: '+result.error);
    else if(!result?.canceled){await loadExtensions();toast('Uzantı yüklendi: '+result.name)}
  },
  removeExtension:async d=>{
    if(await ipcRenderer.invoke('extensions:remove',d.id,activeProfileId)){await loadExtensions();toast('Uzantı kaldırıldı')}
  },
  clearPermissions:async()=>{
    await ipcRenderer.invoke('permissions:clear',activeProfileId);
    await loadPermissions();
    toast('Site izinleri sıfırlandı');
  },
  zoomin:()=>zoom(.1), zoomout:()=>zoom(-.1),
  find:openFind,
  print:()=>{try{active().wv.print()}catch{toast('Yazdırmak için bir web sayfası açın')}},
  locateWeather,
  darkmode:()=>{settings.theme=document.body.classList.contains('dark')?'light':'dark';saveSettings();applyTheme();refreshPage()},
  fullscreen:()=>ipcRenderer.send('fullscreen'),
  devtools:()=>{try{active().wv.openDevTools()}catch{toast('Bir web sayfası açın')}},
  soon:()=>toast('Çok yakında ✨'),
  menu:()=>toggleMenu(),
  hsearch:()=>{const v=$('#hs')?.value;if(v)navigate(active(),v)},
  delbm:d=>{bookmarks.splice(+d.i,1);store.set('bookmarks',bookmarks);renderBookmarksBar();refreshPage()},
  clearhist:()=>{history=[];store.set('history',history);refreshPage();toast('Geçmiş temizlendi')},
  clearbm:()=>{bookmarks=[];store.set('bookmarks',bookmarks);renderBookmarksBar();refreshPage()},
  cleardata:async()=>{await ipcRenderer.invoke('clear-data',activeProfileId);toast('Gezinme verileri temizlendi')},
  theme:d=>{settings.theme=d.v;saveSettings();applyTheme();refreshPage()}
};
function toggleMenu(force){
  const menu=$('#menu');
  if(force===undefined) menu.classList.toggle('show');
  else menu.classList.toggle('show',force);
}

document.addEventListener('click',e=>{
  if(!e.target.closest('#tabMenu')) $('#tabMenu').classList.remove('show');
  if(!e.target.closest('#tabFinder')&&!e.target.closest('#tabFindButton'))closeTabFinder();
  if(!e.target.closest('#menu')&&!e.target.closest('#menuBtn')&&!e.target.closest('[data-act="menu"]')) toggleMenu(false);
  const tabResult=e.target.closest('[data-tab-id]');
  if(tabResult){activate(Number(tabResult.dataset.tabId));closeTabFinder();return}
  const tabAction=e.target.closest('[data-tab-act]');
  if(tabAction){handleTabAction(tabAction.dataset.tabAct,tabAction.dataset.group);return}
  const downloadAction=e.target.closest('[data-download-act]');
  if(downloadAction){actions.download(downloadAction.dataset.downloadAct,downloadAction.dataset.id);return}
  const del=e.target.closest('[data-act="delbm"]');
  if(del){e.stopPropagation();actions.delbm(del.dataset);return}
  const g=e.target.closest('[data-go]'); if(g){navigate(active(),g.dataset.go);return}
  const a=e.target.closest('[data-act]');
  if(a){ if(a.closest('#menu')) toggleMenu(false); actions[a.dataset.act]?.(a.dataset,e) }
});
document.addEventListener('change',e=>{
  const globalSetting=e.target.closest('[data-global-set="adblock"]');
  if(globalSetting){
    const enabled=globalSetting.checked;
    ipcRenderer.invoke('adblock:set',enabled).then(()=>{
      adblockEnabled=enabled;
      localStorage.setItem('velocita_adblock_enabled',String(enabled));
      toast(enabled?'Reklam engelleyici açıldı':'Reklam engelleyici kapatıldı');
    }).catch(error=>{
      globalSetting.checked=!enabled;
      toast('Reklam engelleyici ayarı kaydedilemedi: '+error.message);
    });
    return;
  }
  const s=e.target.closest('[data-set]');
  if(s){settings[s.dataset.set]=s.type==='checkbox'?s.checked:s.value;saveSettings();if(s.dataset.set==='bookmarksBar')renderBookmarksBar();if(s.dataset.set==='accent')applyTheme();toast('Kaydedildi')}
});
document.addEventListener('input',e=>{if(e.target.id==='hq'){const t=active();const p=t.page;const pos=e.target.selectionStart;p.innerHTML=innerHTML('velocita://gecmis',e.target.value);const n=p.querySelector('#hq');n.focus();n.setSelectionRange(pos,pos)}});
$('#tabFindInput').addEventListener('input',renderTabFinder);
$('#tabFindInput').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeTabFinder()}else if(e.key==='Enter'){const first=$('#tabFinderResults [data-tab-id]');if(first){activate(Number(first.dataset.tabId));closeTabFinder()}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='hs')actions.hsearch()});

/* ---------- Üst çubuk düğmeleri ---------- */
$('#plus').onclick=()=>newTab();
$('#tabFindButton').onclick=openTabFinder;
$('#back').onclick=()=>{const t=active();if(canGo(t,-1))t.wv.goBack();else if(t?.url)showPage(t,'home')};
$('#fwd').onclick=()=>{const t=active();if(canGo(t,1))t.wv.goForward()};
$('#reload').onclick=()=>{const t=active();if(t?.wv&&t.ready){t.loading?t.wv.stop():t.wv.reload()}else if(t?.url.startsWith('velocita://'))refreshPage()};
$('#star').onclick=toggleBookmark;
$('#menuBtn').onclick=()=>toggleMenu();
$('#profileBtn').onclick=()=>actions.profiles();
$('#findIn').addEventListener('input',()=>doFind(true,false));
$('#findIn').addEventListener('keydown',e=>{if(e.key==='Enter')doFind(!e.shiftKey,true);if(e.key==='Escape')closeFind()});
$('#findNext').onclick=()=>doFind(true,true);
$('#findPrev').onclick=()=>doFind(false,true);
$('#findX').onclick=closeFind;

/* ---------- Adres çubuğu + öneriler ---------- */
const addr=$('#addr'), sug=$('#suggest'); let sel=-1, items=[], suggestionTimer=null, suggestionRequestId=0;
function renderSuggest(){
  const query=addr.value.trim(), q=query.toLowerCase(); sel=-1;
  clearTimeout(suggestionTimer);
  const requestId=++suggestionRequestId;
  if(!q){sug.classList.remove('show');return}
  const pool=[...bookmarks.map(b=>({...b,k:'★'})),...history.map(h=>({...h,k:'🕘'}))];
  const seen=new Set();
  items=pool.filter(x=>(x.title+x.url).toLowerCase().includes(q)&&!seen.has(x.url)&&seen.add(x.url)).slice(0,6);
  const localRows=()=>[
    `<div class="sg" data-q="${esc(query)}"><span>🔍</span>${esc(query)}<small>${settings.engine} ile ara</small></div>`,
    ...items.map(x=>`<div class="sg" data-q="${esc(x.url)}"><span>${x.k}</span><span>${esc(x.title.slice(0,50))}</span><small>${esc(host(x.url))}</small></div>`)
  ];
  const showRows=suggestions=>{
    if(requestId!==suggestionRequestId||document.activeElement!==addr)return;
    const rows=[
      ...suggestions.map(value=>`<div class="sg" data-q="${esc(value)}"><span>🔎</span><span>${esc(value)}</span><small>${settings.engine} önerisi</small></div>`),
      ...localRows()
    ];
    sug.innerHTML=rows.join(''); sug.classList.add('show');
  };
  showRows([]);
  const looksLikeUrl=/^(https?:\/\/|velocita:\/\/)/i.test(query)||/^[\w-]+(?:\.[\w-]+)+(?:[/:?#].*)?$/i.test(query);
  if(query.length>=2&&!looksLikeUrl){
    suggestionTimer=setTimeout(async()=>{
      try{
        const result=await ipcRenderer.invoke('search:suggest',settings.engine,query);
        if(result?.error)console.warn(result.error);
        showRows(result?.suggestions||[]);
      }catch(error){
        console.warn('Arama önerileri alınamadı:',error);
        showRows([]);
      }
    },180);
  }
}
addr.addEventListener('input',renderSuggest);
addr.addEventListener('focus',()=>addr.select());
addr.addEventListener('blur',()=>setTimeout(()=>{sug.classList.remove('show');updateUI()},120));
addr.addEventListener('keydown',e=>{
  const rows=[...sug.querySelectorAll('.sg')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault(); if(!rows.length)return;
    sel=(sel+(e.key==='ArrowDown'?1:-1)+rows.length)%rows.length;
    rows.forEach((r,i)=>r.classList.toggle('sel',i===sel)); addr.value=rows[sel].dataset.q;
  }else if(e.key==='Enter'){navigate(active(),addr.value);sug.classList.remove('show');addr.blur()}
  else if(e.key==='Escape'){sug.classList.remove('show');addr.blur()}
});
sug.addEventListener('mousedown',e=>{const r=e.target.closest('.sg');if(r){e.preventDefault();navigate(active(),r.dataset.q);sug.classList.remove('show');addr.blur()}});

/* ---------- Klavye kısayolları ---------- */
function shortcut(key,shift){
  switch(key){
    case 'a': if(shift)openTabFinder(); return shift;
    case 't': shift?actions.reopen():newTab(); return true;
    case 'n': newTab('',false,shift); return true;
    case 'w': closeTab(activeId); return true;
    case 'l': addr.focus(); return true;
    case 'r': $('#reload').click(); return true;
    case 'd': toggleBookmark(); return true;
    case 'f': openFind(); return true;
    case 'h': actions.history(); return true;
    case 'j': actions.downloads(); return true;
    case 'tab': cycleTab(shift?-1:1); return true;
    case '+': case '=': zoom(.1); return true;
    case '-': zoom(-.1); return true;
    case '0': zoom(0); return true;
  }
  return false;
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey){ if(shortcut(e.key.toLowerCase(),e.shiftKey)) e.preventDefault() }
  else if(e.altKey&&e.key==='ArrowLeft'){$('#back').click()}
  else if(e.altKey&&e.key==='ArrowRight'){$('#fwd').click()}
  else if(e.key==='F11'){e.preventDefault();actions.fullscreen()}
  else if(e.key==='Escape'){closeFind();toggleMenu(false)}
});
ipcRenderer.on('shortcut',(_,{key,shift})=>shortcut(key,shift));
ipcRenderer.on('html-fullscreen',(_,on)=>{document.body.classList.toggle('html-fs',Boolean(on));setTimeout(()=>active()?.wv?.focus(),60)});
ipcRenderer.on('search-text',(_,d)=>{if(d.profileId&&d.profileId!==activeProfileId)return;newTab(d.text,false,Boolean(d.privateMode))});
ipcRenderer.on('auth:complete',(_,result)=>{
  if(result.profileId!==activeProfileId)return;
  if(result.error){toast('Google girişi tamamlanamadı: '+result.error);return}
  toast('Google hesabına giriş yapıldı');
  loadAuthStatus();
});
ipcRenderer.on('open-url',(_,payload)=>{
  const data=typeof payload==='string'?{url:payload}:payload;
  if(data.profileId&&data.profileId!==activeProfileId)return;
  newTab(data.url,Boolean(data.background),Boolean(data.privateMode));
});
ipcRenderer.on('download',(_,d)=>{
  if(d.profileId!==activeProfileId)return;
  const index=downloads.findIndex(item=>item.id===d.id);
  if(index>=0) downloads[index]=d;
  else downloads.unshift(d);
  const t=active();
  if(t?.url==='velocita://indirmeler'&&Boolean(t.private)===Boolean(d.privateMode))t.page.innerHTML=innerHTML(t.url);
  if(d.state==='completed')toast('İndirildi: '+d.name);
  else if(d.state==='cancelled'||d.state==='interrupted')toast('İndirme tamamlanmadı: '+d.name);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>settings.theme==='auto'&&applyTheme());

document.addEventListener('error',e=>{
  const img=e.target;
  if(img?.tagName!=='IMG')return;
  if(img.classList.contains('site-favicon')||img.classList.contains('result-icon')){
    const fallback=document.createElement('span');
    fallback.className=img.className.includes('result-icon')?'site-icon result-icon':'site-icon';
    fallback.innerHTML=brandGlyph(img.dataset.name||'?',img.dataset.seed||img.dataset.name||'?');
    img.replaceWith(fallback);
    return;
  }
  if(img.classList.contains('fav')){const sp=document.createElement('b');sp.className='fav-letter';sp.textContent=img.dataset.letter||'?';img.replaceWith(sp);return}
  if(img.closest('.tab')){
    img.dataset.failed='true';
    img.hidden=true;
    const fallback=img.parentElement?.querySelector('[data-d]');
    if(fallback)fallback.hidden=false;
  }
},true);

/* ---------- Başlat ---------- */
setIcons();
applyTheme();
renderBookmarksBar();
loadAuthStatus(false);
ipcRenderer.invoke('adblock:get').then(enabled=>{
  adblockEnabled=enabled;
  localStorage.setItem('velocita_adblock_enabled',String(enabled));
  const toggle=document.querySelector('[data-global-set="adblock"]');
  if(toggle)toggle.checked=enabled;
}).catch(error=>toast('Reklam engelleyici ayarı yüklenemedi: '+error.message));
newTab();
const pendingGoogleAccount=localStorage.getItem(PENDING_GOOGLE_ACCOUNT_KEY);
if(pendingGoogleAccount===activeProfileId){
  localStorage.removeItem(PENDING_GOOGLE_ACCOUNT_KEY);
  setTimeout(()=>{
    openInternal('velocita://profiller');
    void actions.authSignInGoogle();
  },350);
}
</script>
